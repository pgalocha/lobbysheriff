apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: lobbysheriff-production

resources:
  - namespace.yaml
  - ../../base

labels:
  - pairs:
      app.kubernetes.io/environment: production
    includeSelectors: false

# Configuração não sensível (versionada)
configMapGenerator:
  - name: lobbysheriff-config
    envs:
      - config.env

# Secrets: secrets.env NÃO é versionado.
# No CI: gerado a partir dos secrets do GitHub Environment "production".
secretGenerator:
  - name: lobbysheriff-secrets
    envs:
      - secrets.env

# Ajustes específicos de produção (réplicas, recursos, HPA) entram aqui, ex.:
# patches:
#   - path: patches/go-stats-api-replicas.yaml
