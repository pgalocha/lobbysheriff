version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  # Descomentar à medida que cada serviço for criado
  # (o Dependabot dá erro se a pasta/manifesto ainda não existir).

  - package-ecosystem: gomod
    directory: /services/go-stats-api
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directories:
      - /services/go-stats-api
      - /.devcontainer
    schedule:
      interval: weekly

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Ficar numa série LTS do MySQL. As versões YY.M (ex.: 26.7) são Innovation,
      # com suporte só até à seguinte. Mudar de série (ex.: 8.4 → 9.7 LTS) é manual,
      # e inclui a imagem mysql do workflow .github/workflows/go-stats-api.yml.
      - dependency-name: mysql
        update-types: ["version-update:semver-major"]

  - package-ecosystem: devcontainers
    directory: /
    schedule:
      interval: weekly

