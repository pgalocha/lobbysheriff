version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  # Descomentar à medida que cada serviço for criado
  # (o Dependabot dá erro se a pasta/manifesto ainda não existir).

  - package-ecosystem: gomod
    directory: /services/go-stats-api
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directories:
      - /services/go-stats-api
      - /.devcontainer
    schedule:
      interval: weekly

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: devcontainers
    directory: /
    schedule:
      interval: weekly

