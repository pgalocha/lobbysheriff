# Infraestrutura local do LobbySheriff.
#
#   cp .env.example .env   # obrigatório: o Compose lê as variáveis daqui
#   docker compose up -d
#
# O Dev Container (.devcontainer/) reutiliza este ficheiro e junta-lhe o
# serviço "dev", na mesma rede — por isso MYSQL_HOST=mysql e REDIS_HOST=redis
# funcionam tanto dentro do Dev Container como entre serviços.

# Nome fixo: o Dev Container e o `docker compose` na raiz partilham o mesmo
# projeto (mesma rede e mesmos volumes), em vez de criarem dois MySQL.
name: lobbysheriff

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?define MYSQL_ROOT_PASSWORD no .env}
      # Lidas pelo script em infra/mysql/initdb.d para criar um schema e um
      # utilizador por serviço (Database per Service).
      STATS_DB_NAME: ${STATS_DB_NAME:?define STATS_DB_NAME no .env}
      STATS_DB_USER: ${STATS_DB_USER:?define STATS_DB_USER no .env}
      STATS_DB_PASSWORD: ${STATS_DB_PASSWORD:?define STATS_DB_PASSWORD no .env}
      PLAYERS_DB_NAME: ${PLAYERS_DB_NAME:?define PLAYERS_DB_NAME no .env}
      PLAYERS_DB_USER: ${PLAYERS_DB_USER:?define PLAYERS_DB_USER no .env}
      PLAYERS_DB_PASSWORD: ${PLAYERS_DB_PASSWORD:?define PLAYERS_DB_PASSWORD no .env}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./infra/mysql/initdb.d:/docker-entrypoint-initdb.d:ro
    # Só em localhost, para clientes no host (ex.: DBeaver no Windows).
    ports:
      - "127.0.0.1:${MYSQL_PUBLISHED_PORT:-3306}:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    # Exige password apenas se REDIS_PASSWORD estiver definida.
    command: ["sh", "-c", "exec redis-server --appendonly yes $${REDIS_PASSWORD:+--requirepass \"$$REDIS_PASSWORD\"}"]
    volumes:
      - redis-data:/data
    ports:
      - "127.0.0.1:${REDIS_PUBLISHED_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning $${REDIS_PASSWORD:+-a \"$$REDIS_PASSWORD\"} ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Aplica as migrations do schema e termina; a API só arranca se correr bem.
  go-stats-migrate:
    image: lobbysheriff/go-stats-api:local
    build: ./services/go-stats-api
    command: ["migrate", "up"]
    restart: "no"
    env_file: .env
    depends_on:
      mysql:
        condition: service_healthy

  go-stats-api:
    image: lobbysheriff/go-stats-api:local
    build: ./services/go-stats-api
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:${GO_STATS_API_PORT:-8080}:${GO_STATS_API_PORT:-8080}"
    depends_on:
      go-stats-migrate:
        condition: service_completed_successfully
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Documentação interativa dos contratos em contracts/openapi/.
  # http://localhost:8090 — o "Try it out" chama a API em localhost:8080
  # (precisa de CORS_ALLOWED_ORIGINS=http://localhost:8090 no .env).
  swagger-ui:
    image: swaggerapi/swagger-ui:v5.35.1
    restart: unless-stopped
    environment:
      URLS: '[{"url": "contracts/go-stats-api.yaml", "name": "go-stats-api"}]'
    volumes:
      - ./contracts/openapi:/usr/share/nginx/html/contracts:ro
    ports:
      - "127.0.0.1:${SWAGGER_UI_PUBLISHED_PORT:-8090}:8080"

volumes:
  mysql-data:
  redis-data:
